name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement de déploiement
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Mise en cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-26.04, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Récupérer l'artefact
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist

      - name: Tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Récupérer le build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist

      - name: Afficher API_URL
        run: echo "API_URL=$API_URL"

      - name: Résumé du déploiement
        env:
          TARGET: ${{ inputs.environment }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Déploiement"
            echo ""
            echo "- Cible : ${TARGET}"
            echo "- URL : ${API_URL}"
            echo "- Commit : ${COMMIT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déployer
        env:
          TARGET: ${{ inputs.environment }}
        shell: bash
        run: |
          echo "Déploiement de dist/ vers ${TARGET}"
          find dist -type f
