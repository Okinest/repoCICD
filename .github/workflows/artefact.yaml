name: Artefact

on:
  push:
    
jobs:
  build-artefact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier la version d'Ubuntu
        run: lsb_release -a 
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Mise en cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Installer les dépendances
        run: npm ci
      - name: build
        run: npm run build
      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: build
          path: dist/
      - name: Résumé du build
        if: always()
        run: |
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Statut : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branche : ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Message : ${{ github.event.head_commit.message }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auteur : ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run : ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node : 24.18.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefact : build (\`dist/\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -d dist ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Contenu de dist/" >> "$GITHUB_STEP_SUMMARY"
            du -sh dist >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            find dist -type f >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi